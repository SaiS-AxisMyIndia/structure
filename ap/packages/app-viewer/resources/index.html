<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Viewer</title>
<style>
  :root {
    --bg: #0f1720; --panel: #182430; --panel-2: #1e2c3a; --border: #2b3a4a;
    --text: #e6edf3; --muted: #8b9bab; --accent: #4da3ff;
    --get: #2f9e5b; --post: #c98a1a; --put: #3d7fc9; --patch: #8b5cf6; --delete: #d64545;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0 0 2px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 65px); }
  .list { border-right: 1px solid var(--border); overflow-y: auto; padding: 8px; }
  .empty { color: var(--muted); }
  .group { margin-bottom: 4px; }
  .group-header { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; user-select: none; }
  .group-header:hover { background: var(--panel-2); }
  .group-header .chevron { font-size: 10px; color: var(--muted); transition: transform .12s ease; display: inline-block; }
  .group-header.collapsed .chevron { transform: rotate(-90deg); }
  .group-count { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: auto; }
  .group-routes { padding-left: 6px; }
  .group-routes.collapsed { display: none; }
  .route { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; }
  .route:hover { background: var(--panel-2); }
  .route.active { background: var(--panel-2); outline: 1px solid var(--accent); }
  .method { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 4px; color: #fff; min-width: 40px; text-align: center; }
  .method-GET { background: var(--get); } .method-POST { background: var(--post); }
  .method-PUT { background: var(--put); } .method-PATCH { background: var(--patch); }
  .method-DELETE { background: var(--delete); }
  .path { font-size: 13px; font-family: ui-monospace, monospace; word-break: break-all; }
  .badge { font-size: 10px; color: var(--muted); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; margin-left: auto; }
  .main { padding: 24px; overflow-y: auto; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .panel-header h2 { margin: 0; font-family: ui-monospace, monospace; font-size: 16px; }
  .mw { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .comment-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .comment-toggle .chevron { font-size: 10px; transition: transform .12s ease; display: inline-block; }
  .comment-toggle.collapsed .chevron { transform: rotate(-90deg); }
  .comment { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 16px; }
  .comment.collapsed { display: none; }
  .icon-btn { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 12px; font-family: ui-monospace, monospace; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn.active { background: var(--accent); color: #06192e; border-color: var(--accent); }
  /* Border button — outlined, transparent, secondary weight (Reset). */
  .btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 7px 16px; font-size: 12px; font-family: ui-monospace, monospace; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .btn-outline:hover { color: var(--text); border-color: var(--accent); }
  /* Elevated button — solid fill + shadow, the row's primary action (Load). */
  .btn-elevated { background: var(--accent); color: #06192e; border: none; border-radius: 6px; padding: 7px 16px; font-size: 12px; font-family: ui-monospace, monospace; font-weight: 700; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 6px rgba(77, 163, 255, .35); }
  .btn-elevated:hover { opacity: .9; }
  .request-panel { margin: 0 0 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .request-panel.hidden { display: none; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
  label:first-child { margin-top: 0; }
  .field { margin-bottom: 8px; }
  .field-label { display: flex; align-items: baseline; gap: 6px; margin: 0 0 4px; }
  .field-label .key { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text); }
  .field-required { color: var(--delete); font-weight: 700; font-size: 13px; }
  .field-optional { color: var(--muted); font-size: 11px; }
  .field-type { font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); border: 1px solid var(--border); padding: 0 5px; border-radius: 3px; margin-left: auto; }
  input[type=text], .request-panel textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; font-family: ui-monospace, monospace; font-size: 13px; }
  .request-panel textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .request-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .request-status { color: var(--muted); font-size: 12px; flex: 1; }
  .frame-wrap iframe { width: 100%; height: calc(100vh - 280px); min-height: 400px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
</style>
</head>
<body>

<header>
  <h1>App Viewer</h1>
  <span class="sub">served at /app-viewer — renders your real Page-returning routes live, same-origin</span>
</header>

<div class="layout">
  <div class="list" id="list"><p class="empty" style="padding:12px;">Loading pages…</p></div>
  <div class="main" id="main"><p class="empty">Pick a page on the left.</p></div>
</div>

<script>
const FIELDS_KEY_PREFIX = 'apc_appviewer_fields:'; // + routeKey(route) per page
const LAST_ROUTE_KEY = 'apc_appviewer_last_route'; // routeKey() of the page last selected, restored on next load
let routes = [];
let activeKey = null;
const collapsedGroups = new Set();

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

function routeKey(route) {
  return route.method + ' ' + route.path;
}

function pathParams(path) {
  return [...path.matchAll(/\{(\w+)\}/g)].map(m => m[1]);
}

// Every value typed into a page's Request panel — path params, query
// fields, body fields alike — is cached per-route, the same idea as
// Tester's own field cache, so reopening the same page later restores
// what was last filled in instead of starting blank.
function loadFieldCache(route) {
  try {
    const raw = localStorage.getItem(FIELDS_KEY_PREFIX + routeKey(route));
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveFieldCache(route, cache) {
  localStorage.setItem(FIELDS_KEY_PREFIX + routeKey(route), JSON.stringify(cache));
}

// Same grouping idea as Tester's list — one collapsible group per
// controller, alphabetical, each holding that controller's own routes.
function groupByController(list) {
  const groups = new Map();
  for (const route of list) {
    const key = route.controller || '(unknown)';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(route);
  }
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

async function loadRoutes() {
  const res = await fetch('/app-viewer/pages');
  const body = await res.json();
  routes = (body.data || []).sort((a, b) => a.path.localeCompare(b.path));

  // Every group starts collapsed on first load, same as Tester.
  groupByController(routes).forEach(([controller]) => collapsedGroups.add(controller));

  // Reopen whatever page was selected last time, its group expanded and
  // its Request panel already showing the field values cached for it
  // (loadFieldCache/renderFieldInputs above) — so coming back to
  // AppViewer picks up right where you left off instead of the blank
  // "Pick a page on the left" state. Still nothing invoked automatically
  // (see renderPanel's own comment): the live iframe below is the same
  // plain GET a manual click would do, never the Request panel's Load.
  const lastKey = localStorage.getItem(LAST_ROUTE_KEY);
  const lastRoute = lastKey ? routes.find(r => routeKey(r) === lastKey) : null;

  if (lastRoute) {
    activeKey = lastKey;
    collapsedGroups.delete(lastRoute.controller || '(unknown)');
  }
  renderList();
  if (lastRoute) renderPanel(lastRoute);
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!routes.length) {
    list.innerHTML = '<p class="empty" style="padding:12px;">No Page-returning routes found — nothing in this app currently declares `: Page` as a return type.</p>';
    return;
  }

  groupByController(routes).forEach(([controller, groupRoutes]) => {
    const isCollapsed = collapsedGroups.has(controller);
    const group = el('div', { class: 'group' });

    const header = el('div', { class: 'group-header' + (isCollapsed ? ' collapsed' : '') });
    header.appendChild(el('span', { class: 'chevron', text: '▾' }));
    header.appendChild(el('span', { text: controller }));
    header.appendChild(el('span', { class: 'group-count', text: String(groupRoutes.length) }));
    header.onclick = () => {
      if (collapsedGroups.has(controller)) collapsedGroups.delete(controller);
      else collapsedGroups.add(controller);
      renderList();
    };
    group.appendChild(header);

    const routesEl = el('div', { class: 'group-routes' + (isCollapsed ? ' collapsed' : '') });
    groupRoutes.forEach(route => {
      const key = routeKey(route);
      const row = el('div', { class: 'route' + (activeKey === key ? ' active' : '') });
      row.appendChild(el('span', { class: 'method method-' + route.method, text: route.method }));
      row.appendChild(el('span', { class: 'path', text: route.path }));
      if (route.middleware.length) row.appendChild(el('span', { class: 'badge', text: route.middleware.length + ' mw' }));
      row.onclick = () => { activeKey = key; localStorage.setItem(LAST_ROUTE_KEY, key); renderList(); renderPanel(route); };
      routesEl.appendChild(row);
    });
    group.appendChild(routesEl);

    list.appendChild(group);
  });
}

// One labeled input per detected field (name, required "*" or
// "(optional)", and its InputBag type as a small badge) — the exact
// same shape/behavior as Tester's own renderFieldInputs(), reused here
// so a page's Request panel looks and behaves identically to an
// endpoint's own request form in Tester. `namespace` keeps query/body
// cache keys from colliding when the same field name is detected in
// both bags.
function renderFieldInputs(panel, fields, legend, fieldCache, namespace, persist) {
  if (!fields.length) return null;

  panel.appendChild(el('label', { text: legend }));
  const inputs = {};

  fields.forEach(field => {
    const wrap = el('div', { class: 'field' });
    const labelRow = el('div', { class: 'field-label' });
    labelRow.appendChild(el('span', { class: 'key', text: field.key }));
    labelRow.appendChild(el('span', {
      class: field.required ? 'field-required' : 'field-optional',
      text: field.required ? '*' : '(optional)',
    }));

    const isJson = field.type === 'JSON';
    let beautifyBtn = null;
    if (isJson) {
      beautifyBtn = el('button', { class: 'icon-btn', title: 'Beautify JSON', text: 'beautify' });
      beautifyBtn.style.marginLeft = 'auto';
      labelRow.appendChild(beautifyBtn);
    }
    const typeTag = el('span', { class: 'field-type', text: field.type });
    if (isJson) typeTag.style.marginLeft = '6px';
    labelRow.appendChild(typeTag);
    wrap.appendChild(labelRow);

    const input = isJson
      ? el('textarea', { placeholder: field.required ? 'required' : 'optional' })
      : el('input', { type: 'text', placeholder: field.required ? 'required' : 'optional' });
    const cacheKey = namespace + ':' + field.key;
    input.value = fieldCache[cacheKey] || '';
    input.oninput = () => { fieldCache[cacheKey] = input.value; persist(); };
    wrap.appendChild(input);
    panel.appendChild(wrap);

    if (beautifyBtn) {
      beautifyBtn.onclick = () => {
        try {
          input.value = JSON.stringify(JSON.parse(input.value), null, 2);
          fieldCache[cacheKey] = input.value;
          persist();
        } catch (e) { /* not valid JSON (yet) — leave it alone */ }
      };
    }

    inputs[field.key] = { input, field };
  });

  return inputs;
}

// A field left blank is omitted (so the action's own InputBag default
// applies) when optional, but still sent (even empty) when required —
// same rule as Tester, so a required field left blank surfaces the
// real "'x' is required." 400 instead of AppViewer silently guessing.
function isBlankAndOptional(field, raw) {
  return raw === '' && !field.required;
}

function coerceFieldValue(field, raw) {
  if (field.type === 'JSON' || field.type === 'Array') {
    try { return JSON.parse(raw); } catch (e) { return raw; }
  }
  return raw;
}

function buildFieldObject(inputs) {
  const obj = {};
  for (const key of Object.keys(inputs)) {
    const { input, field } = inputs[key];
    if (isBlankAndOptional(field, input.value)) continue;
    obj[key] = coerceFieldValue(field, input.value);
  }
  return obj;
}

// Header (title, then a Request button — only for a route with
// something to fill in), an optional description, a Request panel
// (query/body fields + path params, same shape as Tester's own form),
// then the body section — the real page, in an iframe. A route with
// no persisted field values gets no auto-invoke — a Page action might
// have real side effects (a counter, a log line), so with nothing
// cached to send this waits for you to click Load yourself, same as
// Tester's Send. Once you've filled in a route's fields at least once,
// though, opening it again (a click, or the last-selected page on this
// file's own next load) replays that same cached request right away —
// see buildRequestPanel's hasCachedData below.
function renderPanel(route) {
  const main = document.getElementById('main');
  main.innerHTML = '';

  const panelHeader = el('div', { class: 'panel-header' });
  panelHeader.appendChild(el('h2', { text: route.method + ' ' + route.path }));
  main.appendChild(panelHeader);

  main.appendChild(el('div', {
    class: 'mw',
    text: route.middleware.length ? 'Middleware: ' + route.middleware.join(', ') : 'No middleware',
  }));

  if (route.comment) {
    const toggle = el('div', { class: 'comment-toggle collapsed' });
    toggle.appendChild(el('span', { class: 'chevron', text: '▾' }));
    toggle.appendChild(el('span', { text: 'Description' }));
    main.appendChild(toggle);

    const comment = el('div', { class: 'comment collapsed', text: route.comment });
    main.appendChild(comment);

    toggle.onclick = () => {
      toggle.classList.toggle('collapsed');
      comment.classList.toggle('collapsed');
    };
  }

  // The real page, live — built and attached FIRST, unconditionally,
  // before any of the optional Request-panel machinery below runs. A
  // mistake in that (still-evolving) code must never cost you the one
  // thing that actually matters: seeing the page — see the try/catch
  // around it below. No JS-triggered "inspector" button here — no
  // browser exposes an API for a page to launch DevTools on anything,
  // itself included; right-click -> Inspect on the iframe already works
  // natively (same-origin), which is genuinely the whole capability.
  const frameWrap = el('div', { class: 'frame-wrap' });
  const iframe = el('iframe', { title: route.path });
  iframe.src = route.path;
  frameWrap.appendChild(iframe);
  main.appendChild(frameWrap);

  try {
    buildRequestPanel(route, main, panelHeader, frameWrap, iframe);
  } catch (e) {
    // The page above is already showing — this only means no Request
    // panel/button for this route this time, not a blank screen.
    console.error('AppViewer: failed to build the Request panel for ' + route.path, e);
  }
}

// Everything about the optional "fill in a request, Invoke, see the
// result instead of the live page" panel — split out of renderPanel()
// so a bug in here can never take the live iframe down with it (see the
// try/catch at its one call site).
function buildRequestPanel(route, main, panelHeader, frameWrap, iframe) {
  // Path params + query/body fields, exactly what Tester renders for
  // the same route.fields metadata. `kind: 'add'` fields (InputBag's
  // addX() — see its own docblock) are the controller's OWN data, not
  // something a caller ever supplies, so they're never rendered as an
  // input — just a plain read-only mention below the fillable fields
  // (see addFields below). Always shown, even for a route with nothing
  // detected at all — Load then just re-fetches the route with an empty
  // request, and the Error panel (below) still lets you see exactly
  // what came back.
  const fields = route.fields || [];
  const queryFields = fields.filter(f => f.source === 'query' && f.kind !== 'add');
  const bodyFields = fields.filter(f => f.source === 'body' && f.kind !== 'add');
  const addFields = fields.filter(f => f.kind === 'add');
  const paramFieldsByKey = {};
  fields.filter(f => f.source === 'params' && f.kind !== 'add').forEach(f => { paramFieldsByKey[f.key] = f; });
  // Every real {name} placeholder in the URL, PLUS every detected
  // params-source field even when it ISN'T one — a controller can call
  // $request->params->getX('key') for a 'key' that has no matching
  // {key} in its own route (always required, never satisfiable by a
  // real visitor — see AboutController's own `role`); AppViewer still
  // lets you fill it in and send it, since buildTargetRequest() on the
  // server builds params straight from whatever this form submits, not
  // from actually re-matching the URL.
  const params = Array.from(new Set([...pathParams(route.path), ...Object.keys(paramFieldsByKey)]));

  {
    const fieldCache = loadFieldCache(route);
    const persistFields = () => saveFieldCache(route, fieldCache);
    // A route you've filled in before (path params, query, or body —
    // whatever's in fieldCache) loads straight into that filled-in
    // request instead of the blank/likely-400 live route — see doLoad()
    // below, called once automatically when this is true. The panel
    // itself still starts closed either way (below) — this only decides
    // whether the iframe gets that auto-replay, not whether the fields
    // are shown; Request still opens it explicitly.
    const hasCachedData = Object.keys(fieldCache).length > 0;

    const requestBtn = el('button', { class: 'icon-btn', text: 'Request' });
    panelHeader.appendChild(requestBtn);

    const requestPanel = el('div', { class: 'request-panel hidden' });

    const paramInputs = {};
    const paramRequired = {};
    if (params.length) {
      requestPanel.appendChild(el('label', { text: 'Path parameters' }));
      const row = el('div', { class: 'row' });
      params.forEach(p => {
        const detected = paramFieldsByKey[p];
        const required = detected ? detected.required : true;
        paramRequired[p] = required;

        const wrap = el('div', {});
        const labelRow = el('div', { class: 'field-label' });
        labelRow.appendChild(el('span', { class: 'key', text: p }));
        labelRow.appendChild(el('span', {
          class: required ? 'field-required' : 'field-optional',
          text: required ? '*' : '(optional)',
        }));
        if (detected) labelRow.appendChild(el('span', { class: 'field-type', text: detected.type }));
        wrap.appendChild(labelRow);

        const input = el('input', { type: 'text', placeholder: p });
        const cacheKey = 'path:' + p;
        input.value = fieldCache[cacheKey] || '';
        input.oninput = () => { fieldCache[cacheKey] = input.value; persistFields(); };
        wrap.appendChild(input);

        paramInputs[p] = input;
        row.appendChild(wrap);
      });
      requestPanel.appendChild(row);
    }

    const queryInputs = renderFieldInputs(requestPanel, queryFields, 'Query parameters', fieldCache, 'query', persistFields);
    const bodyInputs = renderFieldInputs(requestPanel, bodyFields, 'Body fields', fieldCache, 'body', persistFields);

    // Plain mentions, not inputs — nothing here is something you fill
    // in; it's what the controller itself adds (InputBag's addX())
    // before the view ever reads it, e.g. `posts` from a PostService
    // call. Just the variable name + type, so you know it exists.
    if (addFields.length) {
      requestPanel.appendChild(el('label', { text: 'Provided by the controller' }));
      const mentions = el('div', { class: 'field' });
      addFields.forEach((field, i) => {
        if (i > 0) mentions.appendChild(document.createTextNode('  '));
        const row = el('span', { class: 'field-label', style: 'display:inline-flex;' });
        row.appendChild(el('span', { class: 'key', text: field.key }));
        row.appendChild(el('span', { class: 'field-type', text: field.type }));
        mentions.appendChild(row);
      });
      requestPanel.appendChild(mentions);
    }

    const actions = el('div', { class: 'request-actions' });
    const status = el('span', { class: 'request-status' });
    const resetBtn = el('button', { class: 'btn-outline', title: 'Switch the page below back to the live route', text: 'Reset' });
    const liveBtn = el('button', { class: 'btn-outline', title: 'Open this page with the request above in a new tab', text: 'Live ↗' });
    const loadBtn = el('button', { class: 'btn-elevated', title: 'Load this page with the request above', text: 'Load' });
    const loadCloseBtn = el('button', { class: 'btn-elevated', title: 'Load this page with the request above, then close this panel', text: 'Load & Close' });
    // Status grows to fill the row (see .request-status's flex: 1),
    // pushing the buttons to the end — Reset and Live (outlined,
    // secondary — neither touches the panel below), then Load and
    // Load & Close (both elevated, the row's primary actions).
    actions.appendChild(status);
    actions.appendChild(resetBtn);
    actions.appendChild(liveBtn);
    actions.appendChild(loadBtn);
    actions.appendChild(loadCloseBtn);
    requestPanel.appendChild(actions);

    main.insertBefore(requestPanel, frameWrap);

    function closeRequestPanel() {
      requestPanel.classList.add('hidden');
      requestBtn.classList.remove('active');
    }

    requestBtn.onclick = () => {
      requestPanel.classList.toggle('hidden');
      requestBtn.classList.toggle('active');
    };

    // The one fetch every action below shares — validates required
    // fields, POSTs the panel's current query/body/params to
    // /app-viewer/render (see AppViewerController::render()), and hands
    // back the rendered HTML, or null (with `status` already set to say
    // why) on a missing field, a non-2xx response, or a network error.
    async function fetchRenderedHtml() {
      const missing = [];
      params.forEach(p => { if (paramRequired[p] && !paramInputs[p].value.trim()) missing.push(p); });
      if (queryInputs) {
        Object.keys(queryInputs).forEach(key => {
          const { input, field } = queryInputs[key];
          if (field.required && !input.value.trim()) missing.push(key);
        });
      }
      if (bodyInputs) {
        Object.keys(bodyInputs).forEach(key => {
          const { input, field } = bodyInputs[key];
          if (field.required && !input.value.trim()) missing.push(key);
        });
      }
      if (missing.length) {
        status.textContent = 'Fill in required field' + (missing.length > 1 ? 's' : '') + ': ' + missing.join(', ');
        return null;
      }

      const payload = {
        query: queryInputs ? buildFieldObject(queryInputs) : {},
        body: bodyInputs ? buildFieldObject(bodyInputs) : {},
        params: Object.fromEntries(params.map(p => [p, paramInputs[p].value])),
      };

      const qs = 'controller=' + encodeURIComponent(route.controllerClass) + '&action=' + encodeURIComponent(route.action);

      status.textContent = 'Loading…';

      try {
        const renderRes = await fetch('/app-viewer/render?' + qs, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!renderRes.ok) {
          const errBody = await renderRes.json().catch(() => null);
          status.textContent = 'Error: ' + (errBody ? errBody.message : renderRes.status + ' ' + renderRes.statusText);
          return null;
        }

        return await renderRes.text();
      } catch (e) {
        status.textContent = 'Request failed: ' + e.message;
        return null;
      }
    }

    // Named (not just loadBtn.onclick) so hasCachedData below, and
    // loadCloseBtn, can also call this directly rather than only ever
    // firing from Load's own click. Returns whether it actually loaded
    // (false on a missing required field or a failed/errored request) —
    // loadCloseBtn only closes the panel on true, so a validation or
    // error message never gets closed out from under you unread.
    async function doLoad() {
      const html = await fetchRenderedHtml();
      if (html === null) return false;

      iframe.removeAttribute('src');
      iframe.srcdoc = html;
      status.textContent = 'Loaded with the request above (not live).';
      return true;
    }

    loadBtn.onclick = doLoad;
    loadCloseBtn.onclick = async () => {
      if (await doLoad()) closeRequestPanel();
    };

    // Live ↗ — the browser can't navigate straight to route.path with
    // this data (a real GET/POST from the address bar carries no JSON
    // body, and a body-sourced field like HomeController's `name` is
    // never read from the query string — see pathParams()'s own
    // comment above), so this renders through the exact same
    // /app-viewer/render POST as Load, then hands the resulting HTML to
    // a real new tab via a blob: URL — an actual separate
    // page/tab, not another iframe, with the request above baked in.
    liveBtn.onclick = async () => {
      const html = await fetchRenderedHtml();
      if (html === null) return;

      const blobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      window.open(blobUrl, '_blank');
      status.textContent = 'Opened in a new tab with the request above (not live).';
    };

    // The one case this replays a request automatically: fields already
    // filled in from a previous visit (hasCachedData above) — never a
    // route opened for the first time with nothing cached, since that
    // would mean guessing at side effects nobody asked for.
    if (hasCachedData) doLoad();

    resetBtn.onclick = () => {
      status.textContent = '';
      iframe.removeAttribute('srcdoc');
      iframe.src = route.path;
    };
  }
}

loadRoutes().catch(e => {
  document.getElementById('list').innerHTML = '<p class="empty" style="padding:12px;">Failed to load pages: ' + e.message + '</p>';
});
</script>
</body>
</html>
